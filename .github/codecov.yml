codecov:
  max_report_age: false
  require_ci_to_pass: false
  notify:
    wait_for_ci: true

coverage:
  precision: 2
  round: down
  range: "50...70"
  status:
    patch: true
    default_rules:
      flag_coverage_not_uploaded_behavior: exclude
    project:
      default:
        target: auto
        threshold: 1%
        base: auto 
        if_ci_failed: success
        informational: true
        only_pulls: true

comment:
  layout: "diff,flags,files"
  behavior: default
  require_changes: false
  require_base: true
  require_head: true
  after_n_builds: 1

flag_management:
  default_rules:
    carryforward: true
