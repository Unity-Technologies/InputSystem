{% metadata_file .yamato/config.metadata %}
---

win_trunk_codecov-by-test:
  name : Build & Run trunk - win, code coverage by test method, slow
  agent:
    type: Unity::VM
    image: package-ci/win10:v4
    flavor: b1.large
  variables:
    EDITOR_VERSION: trunk
  commands:        
    - {{ utr_install_win }}
    - {{ upm_ci_install }}
    # Get version 2.3.0-preview of doctools package (it currently fails for 3.0.0-preview).
    # Automatically makes the documentation tests in APIVerification go live.
    - '%GSUDO% choco install netfx-4.7.1-devpack -y --ignore-detected-reboot --ignore-package-codes'
    - git clone --branch "2.3.0-preview" git@github.cds.internal.unity3d.com:unity/com.unity.package-manager-doctools.git Packages/com.unity.package-manager-doctools
    # We keep the samples in Assets/ as they otherwise won't get imported and you can't
    # really work with them. Move them into the package for when we run upm-ci here.
    - move /Y .\Assets\Samples .\Packages\com.unity.inputsystem
    - move /Y .\Assets\Samples.meta .\Packages\com.unity.inputsystem
    - upm-ci package pack --package-path ./Packages/com.unity.inputsystem/
    # Run upm-ci verification tests as well as tests contained in the package.
    - upm-ci package test --package-path ./Packages/com.unity.inputsystem/ -u %EDITOR_VERSION% --enable-code-coverage --code-coverage-options "generateAdditionalMetrics;generateHtmlReport;assemblyFilters:+Unity.InputSystem;pathReplacePatterns:@*,,Library/PackageCache,Packages;generateTestReferences" --extra-utr-arg="--coverage-results-path={{ yamato_source_dir_win }}/upm-ci~/test-results/CodeCoverage/Package"
    # ADBv2 on 2019.4 causes the test runner to not start on initial import when the
    # samples are in the package. Move the samples back into the project.
    - move /Y .\Packages\com.unity.inputsystem\Samples .\Assets
    - move /Y .\Packages\com.unity.inputsystem\Samples.meta .\Assets
    # Now run our full test suite that sits in Assets/Tests by running UTR on our project.
    - ./utr --testproject . --timeout=1200 --editor-location=.Editor --artifacts_path=upm-ci~/test-results/isolation-com.unity.inputsystem.tests --suite=playmode --suite=editor --category=!Performance --api-profile=NET_4_6 --enable-code-coverage --coverage-options="generateAdditionalMetrics;generateHtmlReport;assemblyFilters:+Unity.InputSystem" --coverage-results-path={{ yamato_source_dir_win }}/upm-ci~/test-results/CodeCoverage/Project
    # Merge all the code coverage results into one report.
    - '{{ yamato_source_dir_win }}/.Editor/Unity.exe -projectPath {{ yamato_source_dir_win }} -batchmode -debugCodeOptimization -enableCodeCoverage -coverageResultsPath {{ yamato_source_dir_win }}/upm-ci~/test-results/CodeCoverage/ -coverageOptions "generateAdditionalMetrics;generateHtmlReport;assemblyFilters:+Unity.InputSystem;sourcePaths:{{ yamato_source_dir_win }}/Packages/com.unity.inputsystem/;generateTestReferences" -quit' 
    # Delete the Package and Project reports, only keep the final merged one to keep Aritfacts.zip smaller
    - rmdir /s/q "{{ yamato_source_dir_win }}/upm-ci~/test-results/CodeCoverage/Package"
    - rmdir /s/q "{{ yamato_source_dir_win }}/upm-ci~/test-results/CodeCoverage/Project"
  after:
    - {{ instabilities_install_win }}
    - {{ instabilities_run_win }}  
  artifacts:
    UTR_Output.zip:
      paths:
        - "upm-ci~/test-results/**/*"