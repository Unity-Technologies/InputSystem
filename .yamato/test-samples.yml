{% metadata_file .yamato/config.metadata %}
---
{% for editor in editors %}
test_sample_projects_{{ editor.version }}:
  name : Test Sample Projects {{ editor.version }}
  agent:
    type: Unity::VM::osx
    image: package-ci/macos-13:default
    flavor: m1.mac
  commands:
    - {{ upm_ci_install }}
    - upm-ci package pack --package-path ./Packages/com.unity.inputsystem/
    - curl -sSL https://dot.net/v1/dotnet-install.sh | bash -s -- --channel 8.0 --runtime dotnet && export DOTNET_ROOT="$HOME/.dotnet" && export DOTNET_ROLL_FORWARD=LatestMajor && export PATH="$HOME/.dotnet:$PATH" && upm-ci package test --package-path ./Packages/com.unity.inputsystem/ -u {{ editor.version }}
    - Editor=.Editor/Unity.app/Contents/MacOS/Unity Method=DryRun sh ExternalSampleProjects/publish.sh 
  triggers:
    cancel_old_ci: true
    expression: pull_request.(target eq "develop" AND NOT changes.all match "**/*.md")
  artifacts:
    UTR_Output.zip:
      paths:
        - "upm-ci~/**/*"
{% endfor %}